[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spoofscope"
version = "0.1.0"
description = "Email spoofing exposure audit - SPF, DMARC, DKIM and MX graded in one zero-dependency command over DNS-over-HTTPS"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mehul Patel" }]
keywords = ["security", "dmarc", "spf", "dkim", "email-authentication", "audit", "cli"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.scripts]
spoofscope = "spoofscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
